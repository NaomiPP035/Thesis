<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e14">
  <title>Record a Moment · TUTU</title>
  <link rel="stylesheet" href="assets/mobile/style.css?v=mobile-tabs-2">
  <link rel="stylesheet" href="shared/cloud.css?v=mobile-tabs-2">
  <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
<main class="phone">
  <header>
    <a href="tutu/map-v2.html" aria-label="Open Map V2">✦</a>
    <span>TUTU</span>
    <a href="tutu/map-v2.html">MAP ↗</a>
  </header>

  <section id="capture" class="app-screen capture-screen">
    <div class="heading"><h1>What just happen?</h1></div>
    <button id="record" class="orb" aria-label="Hold to speak, release to finish">
      <canvas id="particles" aria-hidden="true"></canvas>
      <span class="orb-center">
        <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v4M8 22h8"/>
        </svg>
      </span>
    </button>
    <div class="voice-language" aria-label="Spoken language">
      <span>SPEAKING</span>
      <button type="button" data-speech-lang="zh-CN" aria-pressed="true">中文</button>
      <button type="button" data-speech-lang="en-US" aria-pressed="false">EN</button>
    </div>
    <p id="live" aria-live="polite"></p>
    <p id="support" class="support"></p>
  </section>

  <section id="review" class="app-screen" hidden>
    <div class="review-top"><span class="eyebrow">WRITE IT DOWN</span></div>
    <h1>This is your moment.</h1>
    <form id="form">
      <label>Your words<textarea id="transcript" rows="4" required maxlength="5000" placeholder="What just happened? What did your body notice? How did it feel?"></textarea></label>
      <label>Give this moment a name<input id="title" maxlength="80" placeholder="Generated automatically from your words"></label>
      <div class="two">
        <label>When<input id="when" type="datetime-local" required></label>
        <label>Where<input id="place" maxlength="120" placeholder="Finding your location…"><small id="location-status" class="field-note" aria-live="polite">Finding your location…</small></label>
      </div>
      <label>What you touched<input id="object" maxlength="160" placeholder="For example: water, glass, fabric"></label>
      <label>Body<input id="body" maxlength="160" placeholder="For example: palm, nose, soles of my feet"></label>
      <label>Texture and mood<input id="mood" maxlength="200" placeholder="It can be mixed, contradictory, or barely there"></label>
      <fieldset>
        <legend>Choose a color for it</legend>
        <div id="colors"></div>
        <label class="custom-color">Adjust it until it feels right<input id="color" type="color" value="#ef596f" aria-label="Custom star color"></label>
      </fieldset>
      <p id="form-status" role="status"></p>
      <button class="primary" id="send" type="submit">SEND THIS MOMENT INTO THE ATLAS <span>↗</span></button>
    </form>
  </section>

  <section id="settings" class="app-screen settings-screen" hidden>
    <p class="eyebrow">SETTINGS</p>
    <h1>Your cloud.</h1>
    <div id="cloud-dialog" class="cloud-settings-panel"></div>
  </section>

  <section id="success" class="app-screen" hidden>
    <div class="new-star" id="new-star"></div>
    <p class="eyebrow">A MOMENT, NOW A STAR</p>
    <h1>This moment has a place now.</h1>
    <p id="saved-title"></p>
    <a class="primary" href="tutu/map-v2.html" id="view-star">SEE IT IN MAP V2 ↗</a>
    <a class="text-button" href="tutu/map-v1.html" id="view-star-v1">SEE IT IN MAP V1 ↗</a>
    <button id="another" class="text-button">RECORD ANOTHER MOMENT</button>
  </section>

  <nav class="bottom-nav" aria-label="Record navigation">
    <button type="button" data-screen="capture" aria-current="page"><span class="nav-icon">●</span><span>Record</span></button>
    <button type="button" data-screen="review"><span class="nav-icon">＋</span><span>Write</span></button>
    <button type="button" data-screen="settings"><span class="nav-icon">○</span><span>Settings</span></button>
  </nav>
</main>
<script src="shared/vendor/supabase-2.117.1.js"></script>
<script src="shared/cloud-config.js"></script>
<script src="shared/records.js?v=live-4"></script>
<script src="shared/cloud-ui.js?v=mobile-tabs-2"></script>
<script src="assets/mobile/app.js?v=mobile-tabs-2"></script>
</body>
</html>
